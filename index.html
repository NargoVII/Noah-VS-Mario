'use strict';

/* ── INPUT ──────────────────────────────── */
const K={L:0,R:0,A:0,U:0,D:0};
let aPrev=0;

function bindBtn(id,key){
  const el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();K[key]=1;},{passive:false});
  el.addEventListener('touchend',  e=>{e.preventDefault();K[key]=0;},{passive:false});
  el.addEventListener('touchcancel',e=>{e.preventDefault();K[key]=0;},{passive:false});
  el.addEventListener('mousedown',()=>K[key]=1);
  el.addEventListener('mouseup',  ()=>K[key]=0);
  el.addEventListener('mouseleave',()=>K[key]=0);
}
bindBtn('b1L','L');bindBtn('b1R','R');bindBtn('b1A','A');
bindBtn('b2L','L');bindBtn('b2R','R');bindBtn('b2U','U');bindBtn('b2D','D');bindBtn('b2A','A');

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A'].includes(e.key))K.L=1;
  if(['ArrowRight','d','D'].includes(e.key))K.R=1;
  if(['ArrowUp','w','W'].includes(e.key)){K.U=1;K.A=1;}
  if(['ArrowDown','s','S'].includes(e.key))K.D=1;
  if(e.key===' ')K.A=1;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>{
  if(['ArrowLeft','a','A'].includes(e.key))K.L=0;
  if(['ArrowRight','d','D'].includes(e.key))K.R=0;
  if(['ArrowUp','w','W'].includes(e.key)){K.U=0;K.A=0;}
  if(['ArrowDown','s','S'].includes(e.key))K.D=0;
  if(e.key===' ')K.A=0;
});

/* ── SCREEN MANAGEMENT ──────────────────── */
let screen='menu';
function showScreen(s){
  screen=s;
  document.getElementById('menu').hidden=(s!=='menu');
  document.getElementById('g1wrap').hidden=(s!=='game1');
  document.getElementById('g2wrap').hidden=(s!=='game2');
  document.getElementById('g3wrap').hidden=(s!=='game3');
}
function backToMenu(){showScreen('menu');resetG1();resetG2();if(g3raf){cancelAnimationFrame(g3raf);g3raf=0;}}
document.getElementById('mBtn1').onclick=()=>{showScreen('game1');resetG1();};
document.getElementById('mBtn2').onclick=()=>{showScreen('game2');resetG2();};
document.getElementById('mBtn3').onclick=()=>{showScreen('game3');startG3();};
document.getElementById('g1Back').onclick=backToMenu;
document.getElementById('g2Back').onclick=backToMenu;

/* ── G1 State ───────────────────────────── */
let g1={};
function resetG1(){
  g1={
    lvl:0,phase:'play',// play|bossIntro|win|dead|levelEnd|gameWin
    cam:0,
    P:{x:80,y:300,vx:0,vy:0,onGround:false,face:1,hp:5,maxHp:5,inv:0,dead:false},
    F:{x:60,y:300,vx:0,vy:0},
    posHist:[],
    enemies:[],
    pors:[],
    boss:null,
    bossMsg:'',
    msgTimer:0,
    flash:0,
    winTimer:0,
    levelMsg:'',
    levelMsgT:0
  };
  loadLevel(0);
}

function loadLevel(n){
  const ld=LVLS[n];
  g1.lvl=n;
  g1.phase='play';
  g1.cam=0;
  g1.P.x=80;g1.P.y=GY-40;g1.P.vx=0;g1.P.vy=0;g1.P.onGround=false;
  g1.F.x=60;g1.F.y=GY-40;
  g1.posHist=[];
  g1.enemies=ld.enemies.map(e=>({x:e.x,y:GY-30,vx:0.9+n*0.07,face:1,hp:1+Math.floor(n/3),maxHp:1+Math.floor(n/3),inv:0,t:e.t,dead:false,pat:e.x,range:200}));
  g1.pors=ld.pors.map(p=>({x:p.x,y:GY-20,taken:false}));
  const bd=ld.boss;
  g1.boss={t:bd.t,x:5450,y:GY-70,vx:1.5+n*0.2,hp:bd.hp,maxHp:bd.hp,inv:0,face:-1,dead:false,phase:0};
  g1.bossMsg='';
  g1.msgTimer=0;
  g1.flash=0;
  g1.levelMsg=ld.name;
  g1.levelMsgT=120;
}

/* ── G1 Helpers ─────────────────────────── */
function platAt(px,py,pw,ph,ex,ey,ew,eh){
  return ex<px+pw&&ex+ew>px&&ey<py+ph&&ey+eh>py;
}
function resolvePlatCollision(ent,plats){
  ent.onGround=false;
  const eh=ent===g1.P?44:36,ew=ent===g1.P?22:18;
  for(const p of plats){
    if(!platAt(p.x,p.y,p.w,p.h,ent.x-ew/2,ent.y-eh,ew,eh)) continue;
    const fromBottom=ent.y-(p.y+p.h);
    const fromTop=(p.y)-ent.y;
    const fromLeft=ent.x-(p.x+p.w);
    const fromRight=p.x-ent.x;
    const minH=Math.min(Math.abs(fromBottom),Math.abs(fromTop));
    const minV=Math.min(Math.abs(fromLeft),Math.abs(fromRight));
    if(minH<=minV){
      if(Math.abs(fromTop)<Math.abs(fromBottom)){ent.y=p.y;if(ent.vy<0)ent.vy=0;}
      else{ent.y=p.y+p.h;ent.onGround=true;if(ent.vy>0)ent.vy=0;}
    }else{
      if(Math.abs(fromLeft)<Math.abs(fromRight))ent.x=p.x+p.w+ew/2;
      else ent.x=p.x-ew/2;
      ent.vx=0;
    }
  }
  if(ent.y>=GY){ent.y=GY;ent.vy=0;ent.onGround=true;}
}

/* ── G1 Update ──────────────────────────── */
function updateG1(){
  if(g1.phase==='dead'||g1.phase==='gameWin'){
    if(K.A&&!aPrev){
      if(g1.phase==='dead')resetG1();
      else backToMenu();
    }
    aPrev=K.A;return;
  }
  if(g1.phase==='levelEnd'){
    g1.winTimer--;
    if(g1.winTimer<=0){
      if(g1.lvl>=LVLS.length-1){g1.phase='gameWin';}
      else loadLevel(g1.lvl+1);
    }
    return;
  }
  aPrev=K.A;
  const P=g1.P,ld=LVLS[g1.lvl],allPlats=ld.plats;
  const spd=4.2,jmp=-11.5;

  if(K.L){P.vx=-spd;P.face=-1;}
  else if(K.R){P.vx=spd;P.face=1;}
  else P.vx*=0.82;

  if(K.A&&P.onGround){P.vy=jmp;P.onGround=false;}
  P.vy+=GRAV;
  if(P.vy>16)P.vy=16;
  P.x+=P.vx;P.y+=P.vy;
  resolvePlatCollision(P,allPlats);
  P.x=Math.max(20,Math.min(LW-20,P.x));

  // Freja trail
  g1.posHist.unshift({x:P.x,y:P.y});
  if(g1.posHist.length>TRAIL+1)g1.posHist.pop();
  if(g1.posHist.length>TRAIL){
    const t=g1.posHist[TRAIL];
    const dx=t.x-g1.F.x,dy=t.y-g1.F.y,d=Math.hypot(dx,dy);
    if(d>3){g1.F.x+=dx/d*Math.min(d,5);g1.F.y+=dy/d*Math.min(d,5);}
  }

  // Camera
  g1.cam=Math.max(0,Math.min(LW-CW,P.x-CW*0.35));

  // Porridges
  for(const po of g1.pors){
    if(po.taken)continue;
    if(Math.abs(P.x-po.x)<24&&Math.abs(P.y-po.y)<28){
      po.taken=true;P.hp=Math.min(P.maxHp,P.hp+1);g1.flash=15;
    }
  }

  // Enemies
  for(const en of g1.enemies){
    if(en.dead)continue;
    en.x+=en.vx*en.face;
    en.vy=(en.vy||0)+GRAV;if(en.vy>14)en.vy=14;
    en.y+=en.vy;
    resolvePlatCollision(en,allPlats);
    if(en.x<en.pat-en.range||en.x>en.pat+en.range)en.face*=-1;
    if(en.inv>0)en.inv--;
    if(P.inv>0)P.inv--;
    // Stomp
    const stomped=P.vy>0&&P.y-44<en.y-10&&P.y>en.y-30&&Math.abs(P.x-en.x)<24;
    if(stomped){en.hp--;if(en.hp<=0)en.dead=true;P.vy=-8;continue;}
    // Body hit
    if(!stomped&&Math.abs(P.x-en.x)<22&&Math.abs(P.y-en.y)<36&&P.inv<=0){
      P.hp--;P.inv=70;g1.flash=12;
      if(P.hp<=0){P.dead=true;g1.phase='dead';return;}
    }
  }

  // Boss
  const B=g1.boss;
  if(B&&!B.dead){
    B.x+=B.vx*B.face;
    if(B.y>=GY){B.y=GY;B.vy=0;B.onGround=true;}
    else{B.vy=(B.vy||0)+GRAV;B.y+=B.vy;}
    resolvePlatCollision(B,allPlats);
    if(B.x<=g1.cam+80||B.x>=g1.cam+CW-80)B.face*=-1;
    B.x=Math.max(80,Math.min(LW-80,B.x));
    if(B.inv>0)B.inv--;
    // Boss AI: jump occasionally
    if(B.onGround&&Math.random()<0.015)B.vy=-10;
    // stomp boss
    const bStomped=P.vy>0&&P.y-44<B.y-20&&P.y>B.y-50&&Math.abs(P.x-B.x)<38;
    if(bStomped&&B.inv<=0){B.hp--;B.inv=50;P.vy=-9;g1.flash=20;
      if(B.hp<=0){B.dead=true;g1.phase='levelEnd';g1.winTimer=140;
        g1.levelMsg=bossVictoryMsg(B.t);
        g1.levelMsgT=140;
      }
    }
    // boss body hit
    if(!bStomped&&Math.abs(P.x-B.x)<40&&Math.abs(P.y-B.y)<55&&P.inv<=0){
      P.hp--;P.inv=70;g1.flash=15;
      if(P.hp<=0){P.dead=true;g1.phase='dead';return;}
    }
  }

  if(g1.levelMsgT>0)g1.levelMsgT--;
  if(g1.flash>0)g1.flash--;
  if(g1.msgTimer>0)g1.msgTimer--;
}

function bossVictoryMsg(t){
  const msgs={
    cat:'Sierra the cat has been stopped!',
    crab:'The giant crab ran back to the sea!',
    pappa:'Pappa says: OK OK, dinner is ready!',
    wolf:'The big bad wolf is defeated!',
    morMor:'Mormor gives cookies, Morfar winks!',
    viking:'The skane Viking lost his helmet!',
    snake:'The desert snake slithers away!',
    bat:'The cave bat flew back into the dark!',
    snowboss:'The snowman melted away!',
    worm:'The GIANT WORM is defeated! You WIN!!'
  };
  return msgs[t]||'Boss defeated!';
}

/* ── G1 Draw ────────────────────────────── */
function drawG1(){
  const ctx=X1,P=g1.P,ld=LVLS[g1.lvl],cam=g1.cam;
  ctx.save();

  // Background
  const grd=ctx.createLinearGradient(0,0,0,CH);
  grd.addColorStop(0,ld.sky1);grd.addColorStop(1,ld.sky2);
  ctx.fillStyle=grd;ctx.fillRect(0,0,CW,CH);

  // Decorations
  drawDecor(ctx,ld,cam);

  ctx.translate(-cam,0);

  // Ground
  ctx.fillStyle=ld.gc;ctx.fillRect(cam,GY,CW,CH-GY+10);
  ctx.fillStyle=ld.gr;ctx.fillRect(cam,GY,CW,8);

  // Platforms
  for(const p of ld.plats){
    if(p.x+p.w<cam||p.x>cam+CW)continue;
    if(p.sky){
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath();ctx.ellipse(p.x+p.w/2,p.y+9,p.w/2+8,14,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.95)';ctx.fillRect(p.x,p.y,p.w,p.h);
    } else {
      ctx.fillStyle=ld.gr;ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle=ld.gc;ctx.fillRect(p.x,p.y,p.w,6);
    }
  }

  // Porridges
  for(const po of g1.pors){
    if(po.taken)continue;
    drawPorridge(ctx,po.x,po.y);
  }

  // Enemies
  for(const en of g1.enemies){
    if(en.dead||(en.x+30<cam||en.x-30>cam+CW))continue;
    drawEnemy(ctx,en,g1.lvl);
  }

  // Boss
  if(g1.boss&&!g1.boss.dead){
    drawBoss(ctx,g1.boss);
    drawBossHP(ctx,g1.boss,cam);
  }

  // Freja
  drawFreja(ctx,g1.F.x,g1.F.y);
  // Noah
  drawNoah(ctx,P.x,P.y,P.face,P.inv);

  ctx.restore();

  // HUD
  drawHUD(ctx,P);

  // Level/msg overlay
  if(g1.levelMsgT>0){
    const alpha=Math.min(1,g1.levelMsgT/30)*Math.min(1,(g1.levelMsgT)/30);
    ctx.globalAlpha=Math.min(1,alpha+0.1);
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,CH/2-38,CW,76);
    ctx.globalAlpha=1;
    ctx.fillStyle='#ffd700';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText(g1.lvl+1+'/10  '+g1.levelMsg,CW/2,CH/2+8);
  }

  // Flash
  if(g1.flash>0){
    ctx.globalAlpha=g1.flash/30*0.35;
    ctx.fillStyle='#ff5555';ctx.fillRect(0,0,CW,CH);
    ctx.globalAlpha=1;
  }

  // Dead / Win screens
  if(g1.phase==='dead'){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='#ff4444';ctx.font='bold 32px monospace';ctx.textAlign='center';
    ctx.fillText('GAME OVER',CW/2,CH/2-20);
    ctx.fillStyle='#fff';ctx.font='14px monospace';
    ctx.fillText('Press JUMP to try again',CW/2,CH/2+20);
  }
  if(g1.phase==='gameWin'){
    ctx.fillStyle='rgba(20,0,60,0.8)';ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='#ffd700';ctx.font='bold 28px monospace';ctx.textAlign='center';
    ctx.fillText('YOU WIN!!',CW/2,CH/2-40);
    ctx.fillStyle='#fff';ctx.font='13px monospace';
    ctx.fillText('Noah and Freja saved Scandinavia!',CW/2,CH/2);
    ctx.fillText('Press JUMP for menu',CW/2,CH/2+30);
  }
  if(g1.phase==='levelEnd'&&g1.levelMsgT>0){
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='#7eff7e';ctx.font='bold 18px monospace';ctx.textAlign='center';
    ctx.fillText(g1.levelMsg,CW/2,CH/2);
  }
}

function drawHUD(ctx,P){
  ctx.textAlign='left';
  for(let i=0;i<P.maxHp;i++){
    ctx.font='22px serif';
    ctx.fillText(i<P.hp?'❤':'🖤',10+i*26,28);
  }
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(CW-120,6,110,22);
  ctx.fillStyle='#ffd700';ctx.font='11px monospace';ctx.textAlign='right';
  ctx.fillText('LVL '+(g1.lvl+1)+'/10',CW-12,22);
}

function drawDecor(ctx,ld,cam){
  ctx.save();
  const t=ld.theme;
  // Clouds
  ctx.fillStyle=ld.sky2==='#12122a'?'rgba(80,80,130,0.3)':'rgba(255,255,255,0.85)';
  const cx=[-200,-180,200,160,380,120,560,140,740,90,920,110];
  for(let i=0;i<cx.length;i+=2){
    const bx=(cx[i]+cam*0.3)%LW-cam;
    ctx.beginPath();ctx.ellipse(bx,cx[i+1],60,22,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx+40,cx[i+1]-10,45,18,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(bx-30,cx[i+1]-8,40,16,0,0,Math.PI*2);ctx.fill();
  }
  // Thematic decorations
  if(t==='hills'){
    ctx.fillStyle='#2e7d32';
    for(let bx=0;bx<CW;bx+=80){
      ctx.beginPath();ctx.arc(bx+40,CH-50+15,30,Math.PI,0);ctx.fill();
    }
  } else if(t==='london'){
    ctx.fillStyle='rgba(50,50,60,0.6)';
    // Tower Bridge silhouette
    const bx=400-cam*0.1;
    ctx.fillRect(bx,CH-120,12,70);ctx.fillRect(bx+120,CH-120,12,70);
    ctx.fillStyle='rgba(60,60,80,0.5)';
    ctx.fillRect(bx-20,CH-90,160,8);// bridge deck
    ctx.fillRect(bx,CH-120,132,6);// top span
    ctx.fillStyle='rgba(180,0,0,0.4)';
    ctx.fillRect(bx+50,CH-115,32,12);// red phone box outline
  } else if(t==='sweden'){
    // Swedish flag colors in sky
    ctx.globalAlpha=0.08;
    ctx.fillStyle='#006AA7';ctx.fillRect(0,0,CW,CH);
    ctx.globalAlpha=1;
  } else if(t==='skane'){
    // Windmill silhouettes
    ctx.fillStyle='rgba(80,50,20,0.35)';
    for(let wx=100;wx<CW;wx+=220){
      ctx.fillRect(wx,CH-100,14,60);
      ctx.save();ctx.translate(wx+7,CH-98);
      for(let a=0;a<4;a++){ctx.save();ctx.rotate(a*Math.PI/2+0.3);ctx.fillRect(-4,-30,8,30);ctx.restore();}
      ctx.restore();
    }
  } else if(t==='desert'){
    // Sand dunes
    ctx.fillStyle='rgba(255,160,0,0.2)';
    ctx.beginPath();ctx.moveTo(0,CH-50);
    for(let dx=0;dx<=CW;dx+=40)ctx.quadraticCurveTo(dx,CH-80,dx+40,CH-50);
    ctx.lineTo(CW,CH);ctx.lineTo(0,CH);ctx.closePath();ctx.fill();
  } else if(t==='cave'){
    // stalactites
    ctx.fillStyle='rgba(80,80,100,0.5)';
    for(let sx=30;sx<CW;sx+=55){
      ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx+12,60);ctx.lineTo(sx-12,60);ctx.closePath();ctx.fill();
    }
  } else if(t==='snow'){
    ctx.fillStyle='rgba(220,240,255,0.4)';
    for(let sx=0;sx<CW;sx+=4){
      ctx.fillRect(sx,Math.random()*CH,2,4);
    }
  } else if(t==='sky'){
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.beginPath();ctx.ellipse(CW/2,CH-60,300,120,0,0,Math.PI*2);ctx.fill();
  } else if(t==='beach'){
    ctx.fillStyle='rgba(0,80,180,0.25)';
    ctx.fillRect(0,CH-60,CW,50);
  } else if(t==='forest'){
    ctx.fillStyle='rgba(20,80,20,0.4)';
    for(let fx=20;fx<CW;fx+=60){
      ctx.beginPath();ctx.moveTo(fx,CH-50);ctx.lineTo(fx+20,CH-120);ctx.lineTo(fx+40,CH-50);ctx.closePath();ctx.fill();
    }
  }
  ctx.restore();
}

function drawPorridge(ctx,x,y){
  // Bowl
  ctx.fillStyle='#e0e0e0';
  ctx.beginPath();ctx.ellipse(x,y+4,14,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ccc';ctx.fillRect(x-14,y,28,8);
  // Porridge fill
  ctx.fillStyle='#d4a857';
  ctx.beginPath();ctx.ellipse(x,y+1,11,6,0,0,Math.PI*2);ctx.fill();
  // Steam
  ctx.strokeStyle='rgba(200,200,200,0.7)';ctx.lineWidth=1.5;
  for(let s=0;s<3;s++){
    ctx.beginPath();ctx.moveTo(x-5+s*5,y-6);ctx.quadraticCurveTo(x-3+s*5,y-11,x-1+s*5,y-16);ctx.stroke();
  }
  ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='center';
  ctx.fillText('GROT',x,y-20);
}

function drawNoah(ctx,x,y,face,inv){
  if(inv>0&&Math.floor(inv/5)%2===1)return;
  ctx.save();ctx.scale(face,1);const sx=x*face;
  // Legs
  ctx.fillStyle='#f5cba7';ctx.fillRect(sx-6,y-14,10,14);ctx.fillRect(sx+1,y-14,10,14);
  // T-shirt
  ctx.fillStyle='#fff';ctx.fillRect(sx-11,y-30,22,18);
  // Worm on shirt
  ctx.fillStyle='#8bc34a';ctx.beginPath();ctx.arc(sx,y-22,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#558b2f';ctx.beginPath();ctx.arc(sx+5,y-22,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#33691e';ctx.beginPath();ctx.arc(sx+9,y-21,2.5,0,Math.PI*2);ctx.fill();
  // Dot eyes on worm
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx-1,y-23,1.2,0,Math.PI*2);ctx.fill();
  // Arms
  ctx.fillStyle='#f5cba7';ctx.fillRect(sx-16,y-30,6,12);ctx.fillRect(sx+10,y-30,6,12);
  // Head
  ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(sx,y-40,13,0,Math.PI*2);ctx.fill();
  // Hair
  ctx.fillStyle='#5d4037';ctx.fillRect(sx-13,y-52,26,14);
  ctx.beginPath();ctx.arc(sx,y-52,13,Math.PI,0);ctx.fill();
  // Eyes

    // Body

/* ════════════════════════════════════════════
   GAME 2: NOAH AND FREJA LOST IN SCANDINAVIA
════════════════════════════════════════════ */
const C2=document.getElementById('c2');
const X2=C2.getContext('2d');
const V2W=800,V2H=480,V2WW=4800;

// Viking cities
const CITIES=[
  {name:'Uppsala',   x:320, y:200, r:70, visited:false, col:'#ffd700',desc:'Ancient temple city'},
  {name:'Birka',     x:900, y:160, r:65, visited:false, col:'#81d4fa',desc:'Great trading post'},
  {name:'Hedeby',    x:1600,y:280, r:70, visited:false, col:'#ce93d8',desc:'Southern stronghold'},
  {name:'Kaupang',   x:2400,y:200, r:65, visited:false, col:'#a5d6a7',desc:'Northern market'},
  {name:'Jorvik',    x:3200,y:260, r:70, visited:false, col:'#ffcc80',desc:'Viking York'}
];

let g2={};

function resetG2(){
  g2={
    cam:0,
    P:{x:80,y:V2H/2,vx:0,vy:0,face:1,hp:15,maxHp:15,inv:0},
    F:{x:55,y:V2H/2},
    posHist:[],
    hammer:null,
    hammers:[],
    enemies:[],
    runes:[],
    cities:CITIES.map(c=>({...c,visited:false})),
    boss:{x:4200,y:V2H/2,vx:0.8,vy:0,hp:8,maxHp:8,inv:0,phase:0,alive:true,face:-1,timer:0},
    runesGot:0,
    phase:'playing',// playing|win|dead
    msg:'',msgT:0,
    flash:0,
    aPrev:0,
    introMsg:'',
    introT:220
  };
  // Generate enemies
  for(let i=0;i<18;i++){
    const ex=300+Math.random()*(V2WW-600);
    const ey=80+Math.random()*(V2H-160);
    g2.enemies.push({x:ex,y:ey,vx:(Math.random()-0.5)*1.4,vy:(Math.random()-0.5)*1.4,
      t:Math.floor(Math.random()*3),hp:2,maxHp:2,inv:0,dead:false,timer:0});
  }
  // Generate runes
  for(let i=0;i<50;i++){
    const rx=200+Math.random()*(V2WW-400);
    const ry=60+Math.random()*(V2H-120);
    g2.runes.push({x:rx,y:ry,taken:false});
  }
}

function updateG2(){
  if(g2.phase==='dead'||g2.phase==='win'){
    if(K.A&&!g2.aPrev){
      if(g2.phase==='dead')resetG2();
      else backToMenu();
    }
    g2.aPrev=K.A;return;
  }
  g2.aPrev=K.A;

  const P=g2.P,spd=3.8;
  if(K.L){P.vx=-spd;P.face=-1;}
  else if(K.R){P.vx=spd;P.face=1;}
  else P.vx*=0.78;
  if(K.U)P.vy=-spd;
  else if(K.D)P.vy=spd;
  else P.vy*=0.78;
  P.x=Math.max(20,Math.min(V2WW-20,P.x+P.vx));
  P.y=Math.max(30,Math.min(V2H-30,P.y+P.vy));

  // Freja trail
  g2.posHist.unshift({x:P.x,y:P.y});
  if(g2.posHist.length>TRAIL+1)g2.posHist.pop();
  if(g2.posHist.length>TRAIL){
    const t=g2.posHist[TRAIL];
    const dx=t.x-g2.F.x,dy=t.y-g2.F.y,d=Math.hypot(dx,dy);
    if(d>3){g2.F.x+=dx/d*Math.min(d,5);g2.F.y+=dy/d*Math.min(d,5);}
  }

  // Camera
  g2.cam=Math.max(0,Math.min(V2WW-V2W,P.x-V2W*0.3));

  // Throw hammer
  if(K.A&&!g2.aPrev_h&&(!g2.hammers.length||g2.hammers.every(h=>!h.active))){
    const spX=P.face*12,spY=(K.U?-8:K.D?8:0);
    g2.hammers=[{x:P.x,y:P.y,vx:spX+(spX===0?P.face*10:0),vy:spY,active:true,t:0}];
  }
  g2.aPrev_h=K.A;

  // Update hammers
  for(const h of g2.hammers){
    if(!h.active)continue;
    h.x+=h.vx;h.y+=h.vy;h.t++;
    if(h.t>40||h.x<0||h.x>V2WW)h.active=false;
    // hit enemies
    for(const en of g2.enemies){
      if(en.dead)continue;
      if(Math.hypot(h.x-en.x,h.y-en.y)<22){
        en.hp--;h.active=false;g2.flash=10;
        if(en.hp<=0)en.dead=true;
      }
    }
    // hit boss
    const B=g2.boss;
    if(B.alive&&Math.hypot(h.x-B.x,h.y-B.y)<40&&B.inv<=0){
      B.hp--;h.active=false;B.inv=40;g2.flash=20;
      if(B.hp<=0){B.alive=false;g2.phase='win';}
    }
  }

  // Enemies update
  for(const en of g2.enemies){
    if(en.dead)continue;
    if(en.inv>0)en.inv--;
    const dx=P.x-en.x,dy=P.y-en.y,d=Math.hypot(dx,dy);
    if(d<70){en.vx+=dx/d*0.06;en.vy+=dy/d*0.06;}
    en.vx=Math.max(-1.5,Math.min(1.5,en.vx));
    en.vy=Math.max(-2.5,Math.min(2.5,en.vy));
    en.x+=en.vx;en.y+=en.vy;
    en.x=Math.max(10,Math.min(V2WW-10,en.x));
    en.y=Math.max(20,Math.min(V2H-20,en.y));
    // Bounce off walls
    if(en.x<=10||en.x>=V2WW-10)en.vx*=-1;
    if(en.y<=20||en.y>=V2H-20)en.vy*=-1;
    // Hit player
    if(d<22&&P.inv<=0){
      P.hp--;P.inv=140;g2.flash=15;
      if(P.hp<=0){g2.phase='dead';return;}
    }
  }

  // Boss update
  const B=g2.boss;
  if(B.alive){
    if(B.inv>0)B.inv--;
    const dx=P.x-B.x,dy=P.y-B.y,d=Math.hypot(dx,dy);
    B.vx+=(dx/d)*0.06;B.vy+=(dy/d)*0.06;
    B.vx=Math.max(-3.5,Math.min(3.5,B.vx));
    B.vy=Math.max(-3.5,Math.min(3.5,B.vy));
    B.x+=B.vx;B.y+=B.vy;
    B.x=Math.max(50,Math.min(V2WW-50,B.x));
    B.y=Math.max(50,Math.min(V2H-50,B.y));
    if(B.vx>0)B.face=1;else if(B.vx<0)B.face=-1;
    if(d<38&&P.inv<=0){
      P.hp--;P.inv=140;g2.flash=18;
      if(P.hp<=0){g2.phase='dead';return;}
    }
  }

  // Cities
  for(const c of g2.cities){
    if(!c.visited&&Math.hypot(P.x-c.x,P.y-c.y)<c.r){
      c.visited=true;g2.flash=12;
      g2.msg='Welcome to '+c.name+'! '+c.desc;g2.msgT=150;
    }
  }

  // Runes
  for(const r of g2.runes){
    if(r.taken)continue;
    if(Math.hypot(P.x-r.x,P.y-r.y)<18){r.taken=true;g2.runesGot++;g2.flash=8;}
  }

  if(P.inv>0)P.inv--;
  if(g2.flash>0)g2.flash--;
  if(g2.msgT>0)g2.msgT--;
  if(g2.introT>0)g2.introT--;
}

/* ── G2 Draw ────────────────────────────── */
function drawG2(){
  const ctx=X2,cam=g2.cam,P=g2.P;
  ctx.save();

  // Background - top-down Scandinavia landscape
  ctx.fillStyle='#2e7d32';ctx.fillRect(0,0,V2W,V2H);
  // Water strips (fjords)
  ctx.fillStyle='#1565c0';
  ctx.fillRect(0,0,V2W,12);ctx.fillRect(0,V2H-12,V2W,12);
  // Terrain features (parallax-lite)
  ctx.save();ctx.translate(-cam,0);
  // Ground patches
  ctx.fillStyle='#388e3c';
  for(let i=0;i<80;i++){
    const px=(i*61+7)%V2WW,py=(i*37+11)%V2H;
    ctx.beginPath();ctx.ellipse(px,py,30+i%20,20+i%15,i*.3,0,Math.PI*2);ctx.fill();
  }
  // Mountains in background
  ctx.fillStyle='#b0bec5';
  for(let m=0;m<12;m++){
    const mx=m*420+80;
    ctx.beginPath();ctx.moveTo(mx-60,V2H);ctx.lineTo(mx,V2H-100-m*8);ctx.lineTo(mx+60,V2H);ctx.closePath();ctx.fill();
    ctx.fillStyle='#eceff1';ctx.beginPath();ctx.moveTo(mx-20,V2H-90-m*8);ctx.lineTo(mx,V2H-100-m*8);ctx.lineTo(mx+20,V2H-90-m*8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#b0bec5';
  }
  // Roads between cities
  ctx.strokeStyle='rgba(180,150,80,0.4)';ctx.lineWidth=8;ctx.setLineDash([20,15]);
  ctx.beginPath();ctx.moveTo(80,V2H/2);
  for(const c of g2.cities)ctx.lineTo(c.x,c.y);
  ctx.lineTo(4300,V2H/2);ctx.stroke();ctx.setLineDash([]);

  // Cities
  for(const c of g2.cities){
    ctx.save();ctx.translate(c.x,c.y);
    // Glow if visited
    if(c.visited){
      const gl=ctx.createRadialGradient(0,0,c.r*0.5,0,0,c.r*1.4);
      gl.addColorStop(0,c.col+'88');gl.addColorStop(1,'transparent');
      ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,c.r*1.4,0,Math.PI*2);ctx.fill();
    }
    // City circle
    ctx.fillStyle=c.visited?c.col:'rgba(200,200,180,0.6)';
    ctx.beginPath();ctx.arc(0,0,c.r*0.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=c.visited?'#fff':'rgba(200,200,180,0.8)';ctx.lineWidth=3;ctx.stroke();
    // Buildings
    ctx.fillStyle=c.visited?'rgba(255,255,255,0.9)':'rgba(200,200,180,0.7)';
    for(let b=-2;b<=2;b++){
      ctx.fillRect(b*16-5,-(30+Math.abs(b)*8),10,30+Math.abs(b)*8);
    }
    // Name
    ctx.fillStyle=c.visited?'#fff':'rgba(255,255,255,0.7)';
    ctx.font='bold 10px monospace';ctx.textAlign='center';
    ctx.fillText(c.name,0,-c.r*0.6);
    ctx.restore();
  }

  // Runes
  for(const r of g2.runes){
    if(r.taken)continue;
    if(r.x<cam-30||r.x>cam+V2W+30)continue;
    ctx.fillStyle='#ffd700';
    ctx.save();ctx.translate(r.x,r.y);
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3,b=(i+0.5)*Math.PI/3;
      if(i===0)ctx.moveTo(Math.cos(a)*9,Math.sin(a)*9);
      else ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9);
      ctx.lineTo(Math.cos(b)*5,Math.sin(b)*5);
    }
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // Enemies
  for(const en of g2.enemies){
    if(en.dead)continue;
    if(en.x<cam-50||en.x>cam+V2W+50)continue;
    drawV2Enemy(ctx,en);
  }

  // Boss
  if(g2.boss.alive)drawHarald(ctx,g2.boss);

  // Hammers
  for(const h of g2.hammers){
    if(!h.active)continue;
    ctx.save();ctx.translate(h.x,h.y);
    ctx.rotate(h.t*0.4);
    ctx.fillStyle='#9e9e9e';ctx.fillRect(-8,-4,16,8);
    ctx.fillStyle='#795548';ctx.fillRect(-2,-2,4,14);
    ctx.restore();
  }

  // Freja
  drawV2Freja(ctx,g2.F.x,g2.F.y);
  // Noah top-down
  drawV2Noah(ctx,P.x,P.y,P.face,P.inv);

  ctx.restore();

  // HUD
  ctx.textAlign='left';
  for(let i=0;i<P.maxHp;i++){
    ctx.font='20px serif';ctx.fillText(i<P.hp?'❤':'🖤',10+i*24,26);
  }
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(V2W-150,4,142,24);
  ctx.fillStyle='#ffd700';ctx.font='10px monospace';ctx.textAlign='right';
  ctx.fillText('Runes: '+g2.runesGot,V2W-8,20);
  // Cities visited
  const cv=g2.cities.filter(c=>c.visited).length;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(V2W-170,30,162,20);
  ctx.fillStyle='#a5d6a7';ctx.textAlign='right';ctx.font='9px monospace';
  ctx.fillText('Cities: '+cv+'/'+g2.cities.length,V2W-8,44);

  // Intro screen
  if(g2.introT>0){
    const a=Math.min(1,g2.introT/25)*Math.min(1,g2.introT/25);
    ctx.globalAlpha=a;
    ctx.fillStyle='rgba(8,24,8,0.92)';ctx.fillRect(0,0,V2W,V2H);
    ctx.strokeStyle='rgba(255,215,0,0.6)';ctx.lineWidth=3;
    ctx.strokeRect(18,18,V2W-36,V2H-36);
    ctx.strokeRect(26,26,V2W-52,V2H-52);
    // Rune decorations
    ctx.fillStyle='rgba(255,215,0,0.3)';ctx.font='28px monospace';ctx.textAlign='center';
    ctx.fillText('ᚢᛈᛈᛋᚨᛚᚨ  ᛒᛁᚱᚲᚨ  ᚺᛖᛞᛖᛒᚤ',V2W/2,52);
    ctx.fillStyle='#ffd700';ctx.font='bold 22px monospace';
    ctx.fillText('NOAH & FREJA',V2W/2,V2H/2-62);
    ctx.fillStyle='#fff';ctx.font='bold 15px monospace';
    ctx.fillText('Lost in Scandinavia',V2W/2,V2H/2-34);
    ctx.fillStyle='rgba(165,214,167,0.9)';ctx.font='10px monospace';
    ctx.fillText('Vikingatiden  800 e.Kr.',V2W/2,V2H/2);
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.fillText('Flytta: pilar / D-pad',V2W/2,V2H/2+28);
    ctx.fillText('Kasta Mjolnir: ⚡ knapp',V2W/2,V2H/2+50);
    ctx.fillText('Besegra Harald Bluetoth!',V2W/2,V2H/2+72);
    ctx.fillStyle='rgba(255,215,0,0.3)';ctx.font='28px monospace';
    ctx.fillText('ᚲᚨᚢᛈᚨᛜ  ᛃᛟᚱᚢᛁᚲ',V2W/2,V2H-32);
    ctx.globalAlpha=1;
  }

  // City message
  if(g2.msgT>0){
    ctx.globalAlpha=Math.min(1,g2.msgT/20);
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,V2H-70,V2W,55);
    ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText(g2.msg,V2W/2,V2H-38);
    ctx.globalAlpha=1;
  }

  // Flash
  if(g2.flash>0){
    ctx.globalAlpha=g2.flash/25*0.35;
    ctx.fillStyle='#ffff00';ctx.fillRect(0,0,V2W,V2H);
    ctx.globalAlpha=1;
  }

  // Screens
  if(g2.phase==='dead'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,V2W,V2H);
    ctx.fillStyle='#ff4444';ctx.font='bold 30px monospace';ctx.textAlign='center';
    ctx.fillText('GAME OVER',V2W/2,V2H/2-20);
    ctx.fillStyle='#fff';ctx.font='13px monospace';ctx.fillText('Press ⚡ to try again',V2W/2,V2H/2+20);
  }
  if(g2.phase==='win'){
    ctx.fillStyle='rgba(0,0,40,0.85)';ctx.fillRect(0,0,V2W,V2H);
    ctx.fillStyle='#ffd700';ctx.font='bold 24px monospace';ctx.textAlign='center';
    ctx.fillText('BLUETOOTH BROKEN!',V2W/2,V2H/2-60);
    ctx.fillStyle='#a5d6a7';ctx.font='13px monospace';
    ctx.fillText("Harald's blue tooth fell out!",V2W/2,V2H/2-25);
    ctx.fillText("The trolls are disconnected!",V2W/2,V2H/2+5);
    ctx.fillStyle='#81d4fa';ctx.fillText("Scandinavia is safe again!",V2W/2,V2H/2+35);
    ctx.fillStyle='#fff';ctx.font='11px monospace';ctx.fillText('Press ⚡ for menu',V2W/2,V2H/2+70);
  }
}

function drawV2Noah(ctx,x,y,face,inv){
  if(inv>0&&Math.floor(inv/5)%2===1)return;
  ctx.save();ctx.translate(x,y);
  // Body/face
  ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5d4037';
  ctx.beginPath();ctx.arc(0,-3,13,Math.PI,0);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(-9,2,18,8);
  ctx.fillStyle='#8bc34a';ctx.beginPath();ctx.arc(0,6,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-4,-2,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(4,-2,2,0,Math.PI*2);ctx.fill();
  // Viking helmet
  ctx.fillStyle='#9e9e9e';
  ctx.fillRect(-13,-14,26,8);
  ctx.fillRect(-15,-14,4,14);
  ctx.fillRect(11,-14,4,14);
  ctx.fillStyle='#bdbdbd';
  ctx.beginPath();ctx.arc(0,-16,14,Math.PI,0);ctx.fill();
  // Horns
  ctx.fillStyle='#f5f5dc';
  ctx.beginPath();ctx.moveTo(-13,-16);ctx.bezierCurveTo(-22,-20,-26,-10,-20,-4);ctx.lineTo(-13,-10);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(13,-16);ctx.bezierCurveTo(22,-20,26,-10,20,-4);ctx.lineTo(13,-10);ctx.closePath();ctx.fill();
  // Direction indicator
  ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();
  ctx.arc(face*8,5,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd700';ctx.font='bold 8px monospace';ctx.textAlign='center';
  ctx.fillText('NOAH',0,28);
  ctx.restore();
}

function drawV2Freja(ctx,x,y){
  ctx.save();ctx.translate(x,y);
  // Body/face
  ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fdd835';ctx.fillRect(-9,-10,18,12);
  ctx.beginPath();ctx.arc(0,-8,10,Math.PI,0);ctx.fill();
  ctx.fillStyle='#e91e63';ctx.fillRect(-7,2,14,8);
  ctx.fillStyle='#1565c0';ctx.beginPath();ctx.arc(-3,-2,1.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(3,-2,1.8,0,Math.PI*2);ctx.fill();
  // Viking helmet (smaller, rounder for Freja)
  ctx.fillStyle='#b0bec5';
  ctx.beginPath();ctx.arc(0,-10,11,Math.PI,0);ctx.fill();
  ctx.fillRect(-11,-12,22,6);
  ctx.fillStyle='#cfd8dc';
  ctx.fillRect(-13,-12,3,10);
  ctx.fillRect(10,-12,3,10);
  // Horns (smaller)
  ctx.fillStyle='#f5f5dc';
  ctx.beginPath();ctx.moveTo(-11,-12);ctx.bezierCurveTo(-18,-16,-20,-8,-15,-4);ctx.lineTo(-11,-8);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(11,-12);ctx.bezierCurveTo(18,-16,20,-8,15,-4);ctx.lineTo(11,-8);ctx.closePath();ctx.fill();
  // Braids
  ctx.fillStyle='#fdd835';
  ctx.fillRect(-13,0,4,12);
  ctx.fillRect(9,0,4,12);
  ctx.fillStyle='#ffd700';ctx.font='bold 8px monospace';ctx.textAlign='center';
  ctx.fillText('FREJA',0,24);
  ctx.restore();
}

function drawV2Enemy(ctx,en){
  const cols=['#ef5350','#78909c','#8d6e63'];
  ctx.save();ctx.translate(en.x,en.y);
  ctx.fillStyle=cols[en.t%3];
  ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();
  if(en.t===0){// wolf - ears
    ctx.beginPath();ctx.moveTo(-10,-12);ctx.lineTo(-5,-22);ctx.lineTo(2,-10);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(10,-12);ctx.lineTo(5,-22);ctx.lineTo(-2,-10);ctx.closePath();ctx.fill();
  } else if(en.t===1){// troll - horns
    ctx.fillStyle='#5d4037';
    ctx.fillRect(-12,-12,6,10);ctx.fillRect(6,-12,6,10);
  } else {// berserker - axe symbol
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-8,-8);ctx.lineTo(8,8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-8,8);ctx.lineTo(8,-8);ctx.stroke();
  }
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-1,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(4,-1,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-4,-1,1.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(4,-1,1.2,0,Math.PI*2);ctx.fill();
  if(en.inv>0)ctx.globalAlpha=0.5;
  ctx.restore();
}

function drawHarald(ctx,B){
  ctx.save();ctx.translate(B.x,B.y);
  if(B.face<0)ctx.scale(-1,1);
  // Body
  ctx.fillStyle='#37474f';ctx.fillRect(-24,-50,48,45);
  // Viking helmet
  ctx.fillStyle='#8d6e63';ctx.fillRect(-22,-68,44,20);
  ctx.beginPath();ctx.arc(0,-68,22,Math.PI,0);ctx.fill();
  ctx.fillStyle='#9e9e9e';ctx.fillRect(-32,-62,10,8);ctx.fillRect(22,-62,10,8);
  // Face
  ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(0,-56,18,0,Math.PI*2);ctx.fill();
  // Eyes
  ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-6,-56,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(6,-56,3,0,Math.PI*2);ctx.fill();
  // BLUE TOOTH (the key feature!)
  ctx.fillStyle='#333';ctx.fillRect(-10,-46,20,8);// mouth (open)
  ctx.fillStyle='#fff';// other teeth
  ctx.fillRect(-8,-46,5,6);ctx.fillRect(-1,-46,5,6);ctx.fillRect(4,-46,5,6);
  ctx.fillStyle='#2196f3';// THE BLUE TOOTH
  ctx.fillRect(-14,-46,5,8);// one big blue tooth on the side!
  ctx.fillStyle='rgba(33,150,243,0.4)';// bluetooth glow
  ctx.beginPath();ctx.arc(-12,-44,12,0,Math.PI*2);ctx.fill();
  // Beard
  ctx.fillStyle='#5d4037';ctx.beginPath();ctx.arc(0,-44,18,0,Math.PI);ctx.fill();
  // Axe
  ctx.fillStyle='#9e9e9e';ctx.fillRect(24,-50,6,40);// handle
  ctx.fillRect(20,-56,16,12);// blade
  ctx.fillStyle='#bdbdbd';ctx.fillRect(22,-58,12,4);
  // HP bar
  const bw=80;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-bw/2-4,-80,bw+8,12);
  ctx.fillStyle='#c62828';ctx.fillRect(-bw/2,-78,bw*(B.hp/B.maxHp),8);
  ctx.fillStyle='#fff';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('HARALD',0,-84);
  ctx.restore();
}

}

/* ════════════════════════════════════════════
   GAME 3: MASKARNA
════════════════════════════════════════════ */
const C3=document.getElementById('c3');
const X3=C3.getContext('2d');
let g3raf=0;

const G3_GRAV=0.45,G3_JMP=-9;
const worms3=[
  {shirtColor:'#1565c0',shirtText:'Noah',cap:true,hairColor:null,
   x:0,y:0,vy:0,onGround:true,bobT:0,sayT:0},
  {shirtColor:'#e91e63',shirtText:'Freja',cap:false,hairColor:'#fdd835',
   x:0,y:0,vy:0,onGround:true,bobT:Math.PI,sayT:0}
];
let g3autoT=0;

function g3Ground(){return C3.height-70;}

function g3Jump(){
  worms3.forEach(w=>{
    if(w.onGround){w.vy=G3_JMP+(Math.random()-0.5)*1.5;w.onGround=false;w.sayT=110;}
  });
}

function startG3(){
  const cw=C3.offsetWidth||600,ch=C3.offsetHeight||400;
  C3.width=Math.max(300,cw);C3.height=Math.max(300,ch);
  worms3[0].x=C3.width/2-80;worms3[1].x=C3.width/2+80;
  worms3.forEach(w=>{w.y=g3Ground();w.vy=0;w.onGround=true;w.sayT=0;});
  g3autoT=0;
  if(g3raf)cancelAnimationFrame(g3raf);
  g3loop();
}

function g3loop(){
  g3raf=requestAnimationFrame(g3loop);
  if(document.getElementById('g3wrap').hidden)return;
  g3autoT++;
  if(g3autoT>180){g3autoT=0;g3Jump();}
  const g=g3Ground();
  worms3.forEach(w=>{
    w.bobT+=0.05;
    if(!w.onGround){w.vy+=G3_GRAV;w.y+=w.vy;if(w.y>=g){w.y=g;w.vy=0;w.onGround=true;}}
    if(w.sayT>0)w.sayT--;
  });
  const ctx=X3,cw=C3.width,ch=C3.height;
  // Background
  const sky=ctx.createLinearGradient(0,0,0,ch*0.75);
  sky.addColorStop(0,'#87ceeb');sky.addColorStop(1,'#c8e6c9');
  ctx.fillStyle=sky;ctx.fillRect(0,0,cw,ch);
  // Clouds
  ctx.fillStyle='rgba(255,255,255,0.85)';
  [[80,50,32],[cw-90,60,28],[cw/2,40,24]].forEach(([cx,cy,r])=>{
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+r*0.7,cy+5,r*0.7,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx-r*0.6,cy+7,r*0.6,0,Math.PI*2);ctx.fill();
  });
  // Sun
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(cw-50,45,22,0,Math.PI*2);ctx.fill();
  // Ground
  ctx.fillStyle='#2d5a1b';ctx.fillRect(0,g+10,cw,ch);
  ctx.strokeStyle='#4a8c2a';ctx.lineWidth=2;
  for(let i=0;i<cw;i+=14){
    const bh=5+Math.sin(i*0.3)*3;
    ctx.beginPath();ctx.moveTo(i,g+10);ctx.lineTo(i+3,g+10-bh);ctx.lineTo(i+6,g+10);ctx.stroke();
  }
  ctx.fillStyle='#5c3d1a';ctx.fillRect(0,g+18,cw,ch);
  // Worms
  worms3.forEach(w=>{
    const bOff=w.onGround?Math.sin(w.bobT)*3:0;
    const x=w.x,y=w.y+bOff;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(x,g+8,18,5,0,0,Math.PI*2);ctx.fill();
    // Body segments
    // Bottom (shirt)
    ctx.fillStyle=w.shirtColor;
    ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 7px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(w.shirtText,x,y);
    // Middle
    ctx.fillStyle='#d4876a';
    ctx.beginPath();ctx.arc(x+1,y-23,14,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#b8604a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x+1,y-23,11,Math.PI*0.2,Math.PI*0.8);ctx.stroke();
    // Head
    ctx.fillStyle='#e8a080';
    ctx.beginPath();ctx.arc(x,y-43,11,0,Math.PI*2);ctx.fill();
    // Eyes
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x-4,y-45,3.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+4,y-45,3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(x-4,y-45,1.8,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+4,y-45,1.8,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#7a3a00';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y-42,3.5,0.1,Math.PI-0.1);ctx.stroke();
    // Cap or hair
    if(w.cap){
      ctx.fillStyle='#0d47a1';
      ctx.beginPath();ctx.arc(x,y-46,11,Math.PI,0);ctx.fill();
      ctx.fillRect(x-11,y-47,22,4);
      ctx.fillStyle='#1565c0';ctx.fillRect(x-13,y-45,26,3);
    } else {
      ctx.fillStyle=w.hairColor;
      ctx.beginPath();ctx.arc(x,y-47,11,Math.PI,0);ctx.fill();
      ctx.fillRect(x-12,y-48,5,32);
      ctx.fillRect(x+7,y-48,5,32);
      ctx.fillStyle='#fff9c4';ctx.globalAlpha=0.4;
      ctx.fillRect(x-8,y-50,3,25);
      ctx.globalAlpha=1;
    }
    // Speech bubble
    if(w.sayT>0){
      const a=Math.min(1,w.sayT/12)*Math.min(1,w.sayT/12);
      ctx.globalAlpha=a;
      const bx=x,by=y-68;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      const bw=114,bh2=28,br=7;
      const bx0=bx-bw/2,by0=by-bh2;
      ctx.moveTo(bx0+br,by0);ctx.lineTo(bx0+bw-br,by0);ctx.quadraticCurveTo(bx0+bw,by0,bx0+bw,by0+br);
      ctx.lineTo(bx0+bw,by0+bh2-br);ctx.quadraticCurveTo(bx0+bw,by0+bh2,bx0+bw-br,by0+bh2);
      ctx.lineTo(bx0+br,by0+bh2);ctx.quadraticCurveTo(bx0,by0+bh2,bx0,by0+bh2-br);
      ctx.lineTo(bx0,by0+br);ctx.quadraticCurveTo(bx0,by0,bx0+br,by0);ctx.closePath();ctx.fill();
      ctx.fillStyle='#bbb';
      ctx.beginPath();ctx.moveTo(bx-5,by+6);ctx.lineTo(bx+5,by+6);ctx.lineTo(bx,by+16);ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(bx-4,by+6);ctx.lineTo(bx+4,by+6);ctx.lineTo(bx,by+14);ctx.closePath();ctx.fill();
      ctx.fillStyle='#222';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('Jag är en mask!',bx,by-bh2/2+2);
      ctx.globalAlpha=1;
    }
  });
}
